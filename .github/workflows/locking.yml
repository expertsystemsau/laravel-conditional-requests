name: locking

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contention:
    runs-on: ubuntu-latest

    name: row locks - ${{ matrix.driver }}

    strategy:
      fail-fast: false
      matrix:
        driver: [mysql, pgsql]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: conditional_requests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: conditional_requests
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, pdo_mysql, pdo_pgsql, bcmath, intl
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          composer update --prefer-dist --no-interaction --no-progress --no-scripts
          composer run prepare

      - name: Row lock contention
        env:
          CONDITIONAL_LOCK_DRIVER: ${{ matrix.driver }}
          CONDITIONAL_LOCK_HOST: 127.0.0.1
          CONDITIONAL_LOCK_PORT: ${{ matrix.driver == 'pgsql' && '5432' || '3306' }}
          CONDITIONAL_LOCK_DATABASE: conditional_requests
          CONDITIONAL_LOCK_USERNAME: ${{ matrix.driver == 'pgsql' && 'postgres' || 'root' }}
          CONDITIONAL_LOCK_PASSWORD: secret
        # A gated suite that silently skips in CI is exactly as useless as no
        # suite, so the job fails if it did not actually run. pipefail keeps the
        # tee from swallowing a genuine test failure.
        run: |
          set -o pipefail
          composer test:lock 2>&1 | tee lock.log
          if grep -qi 'skipped' lock.log; then
            echo "The contention suite skipped — the gate did not see its environment."
            exit 1
          fi
